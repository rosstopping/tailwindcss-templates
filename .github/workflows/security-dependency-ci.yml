            env={'APP_ENV':'testing','APP_KEY':'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=','APP_URL':'http://localhost','DB_CONNECTION':'sqlite','DB_DATABASE':':memory:','DB_URL':'','DATABASE_URL':'','MAIL_MAILER':'array','QUEUE_CONNECTION':'sync','CACHE_STORE':'array','CACHE_DRIVER':'array','SESSION_DRIVER':'array','GOOGLE_TAG_MANAGER_ENABLED':'false'}
            if (d/'artisan').exists():run(['php','artisan','package:discover','--ansi'],d,env)
